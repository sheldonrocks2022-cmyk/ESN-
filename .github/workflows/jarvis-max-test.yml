name: JARVIS MAX Android Test APK
on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-max-v1
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Vendor llama.cpp
        run: |
          rm -rf "$GITHUB_WORKSPACE/app/src/main/cpp/llama.cpp"
          git clone --no-checkout https://github.com/ggml-org/llama.cpp.git "$GITHUB_WORKSPACE/app/src/main/cpp/llama.cpp"
          git -C "$GITHUB_WORKSPACE/app/src/main/cpp/llama.cpp" checkout 60081bb2b5b3294165a4d67c5cbeebe74c868014
      - name: Build debug APK
        run: gradle assembleDebug --no-build-cache
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MAX-Android-Test
          path: app/build/outputs/apk/debug/app-debug.apk
