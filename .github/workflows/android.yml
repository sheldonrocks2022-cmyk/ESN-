name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Name APK for this build
        if: github.event_name != 'pull_request'
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JARVIS-build-${{ github.run_number }}.apk

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/JARVIS-build-${{ github.run_number }}.apk
          compression-level: 0

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS Build ${{ github.run_number }}
          body: |
            Automated JARVIS Android build from main.
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: false
